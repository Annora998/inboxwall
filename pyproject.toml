[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "inboxwall"
version = "2.1.0"
description = "Local-first, read-only AI email security wall."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "InBox Wall Team"}
]
dependencies = [
    "beautifulsoup4>=4.12.0",
    "lxml>=4.9.0",
    "css-inline>=0.11.0",
    "imap-tools>=1.5.0",
    "fastapi>=0.100.0",
    "uvicorn>=0.23.0",
    "mcp<2"
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "ruff>=0.1.0",
    "mypy>=1.5.0"
]

[project.scripts]
inboxwall-serve = "inboxwall.cli:serve"
inboxwall-mcp = "inboxwall.cli:run_mcp"
inboxwall-doctor = "inboxwall.cli:doctor"
inboxwall-benchmark = "inboxwall.cli:benchmark"

[tool.setuptools.packages.find]
where = ["."]
include = ["inboxwall*"]

[tool.ruff]
line-length = 100
target-version = "py310"